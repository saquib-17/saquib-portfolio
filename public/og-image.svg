<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#050814"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.08)"/>
    </pattern>
    <radialGradient id="orb1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Ambient glow orbs -->
  <ellipse cx="200" cy="150" rx="350" ry="250" fill="url(#orb1)" filter="url(#blur)"/>
  <ellipse cx="1000" cy="480" rx="300" ry="200" fill="url(#orb2)" filter="url(#blur)"/>
  
  <!-- Main content container -->
  <g transform="translate(600, 315)">
    <!-- Logo/Brand mark -->
    <g transform="translate(-60, -140)">
      <rect x="0" y="0" width="120" height="120" rx="24" fill="#0A1022" stroke="rgba(56,189,248,0.3)" stroke-width="2"/>
      <text x="60" y="82" font-family="JetBrains Mono, monospace" font-size="36" font-weight="bold" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">SA</text>
    </g>
    
    <!-- Name -->
    <text x="0" y="-40" font-family="Plus Jakarta Sans, sans-serif" font-size="48" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1">Mohammed Saquib Ansari</text>
    
    <!-- Title/Role -->
    <text x="0" y="20" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="500" fill="#38bdf8" text-anchor="middle">MERN Stack Developer & Java Programmer</text>
    
    <!-- Subtitle -->
    <text x="0" y="55" font-family="JetBrains Mono, monospace" font-size="16" fill="#818cf8" text-anchor="middle">DSA Enthusiast • Incoming MCA @ PES University</text>
    
    <!-- Divider -->
    <line x1="-100" y1="95" x2="100" y2="95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    
    <!-- Tech tags -->
    <g transform="translate(0, 120)">
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="110" height="40" rx="8" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
        <text x="55" y="26" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">React</text>
      </g>
      <g transform="translate(-55, 0)">
        <rect x="0" y="0" width="110" height="40" rx="8" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
        <text x="55" y="26" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(70, 0)">
        <rect x="0" y="0" width="110" height="40" rx="8" fill="rgba(129,140,248,0.15)" stroke="rgba(129,140,248,0.3)" stroke-width="1"/>
        <text x="55" y="26" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">Java</text>
      </g>
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="110" height="40" rx="8" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
        <text x="55" y="26" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">MongoDB</text>
      </g>
    </g>
    
    <!-- Status badge -->
    <g transform="translate(0, 190)">
      <rect x="-140" y="0" width="280" height="44" rx="22" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.4)" stroke-width="1.5"/>
      <circle cx="-110" cy="22" r="6" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="29" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600" fill="#34d399" text-anchor="middle">Open to SDE Opportunities</text>
    </g>
    
    <!-- URL -->
    <text x="0" y="260" font-family="JetBrains Mono, monospace" font-size="14" fill="#64748B" text-anchor="middle">saquib-ansari.dev</text>
  </g>
  
  <!-- Decorative code brackets -->
  <g transform="translate(100, 500)" opacity="0.15">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="28" fill="#38bdf8">{</text>
    <text x="0" y="35" font-family="JetBrains Mono, monospace" font-size="16" fill="#94A3B8">// Building resilient</text>
    <text x="0" y="55" font-family="JetBrains Mono, monospace" font-size="16" fill="#94A3B8">// full-stack apps</text>
    <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="28" fill="#38bdf8">}</text>
  </g>
  
  <g transform="translate(1000, 500)" opacity="0.15">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="28" fill="#818cf8">{</text>
    <text x="0" y="35" font-family="JetBrains Mono, monospace" font-size="16" fill="#94A3B8">// Mastering DSA</text>
    <text x="0" y="55" font-family="JetBrains Mono, monospace" font-size="16" fill="#94A3B8">// in Java</text>
    <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="28" fill="#818cf8">}</text>
  </g>
</svg>